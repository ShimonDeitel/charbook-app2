name: Charbook
options:
  bundleIdPrefix: com.shimondeitel.woodburninglog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Charbook:
    type: application
    platform: iOS
    sources:
      - path: Charbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.woodburninglog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Charbook/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  CharbookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CharbookTests
      - path: Charbook.storekit
    dependencies:
      - target: Charbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.woodburninglog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  CharbookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CharbookUITests
    dependencies:
      - target: Charbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.woodburninglog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Charbook:
    build:
      targets:
        Charbook: all
        CharbookTests: [test]
        CharbookUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Charbook.storekit
    test:
      config: Debug
      storeKitConfiguration: Charbook.storekit
      targets:
        - CharbookTests
        - CharbookUITests
    archive:
      config: Release
